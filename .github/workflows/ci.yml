# CI for the Tacenta repository: format, lint, tests, the hygiene guards, and
# the Lean specification build, all on GitHub-hosted runners. The Aeneas T1
# verification, the Swift, Android and WebAssembly packaging, the conformance
# run against hosted Tacenta, and deployment run in the release pipeline.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here writes to the repository, and a workflow
# that runs on pull requests should not hold a token that could.
permissions:
  contents: read

env:
  # The elan release the Lean job installs, and the sha256 of its
  # x86_64-unknown-linux-gnu archive as GitHub lists it for the release asset
  # (https://github.com/leanprover/elan/releases/tag/v4.2.4).
  # tooling/install-elan.sh compares the two before it runs anything from the
  # archive. Bumping the release means recomputing the digest; a mismatch fails
  # the job.
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The bounded group-chat demonstration, step by step: each step must run
      # exactly the tests tooling/group-chat-demo-tests.txt lists for it, by
      # binary and name, and all of them must pass. It fails a step that runs
      # zero tests, ignores one, or runs a different set. It does not read test
      # bodies; docs/reproduce.md says what it does and does not establish.
      - name: Group demo, the listed tests ran and passed
        run: sh tooling/run-group-chat-demo.sh

  # The lifecycle carve-out is a product dependency change.  Keep a native
  # Windows workspace test in the pull-request matrix so Phase 0 does not rely
  # on Linux-only facade and dependency evidence.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo test --locked --workspace

  checks:
    runs-on: ubuntu-latest
    steps:
      # The full history, so a push can be checked from the commit before it
      # (the sign-off step below).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash tooling/check-workflows.sh
      - run: bash tooling/check-versions.sh
      - run: bash tooling/check-conformance-lines.sh
      - run: bash tooling/check-surface.sh
      # The group wire vectors are written by a Rust test (the rust job diffs the
      # committed file) and replayed here by a second program that agrees with them
      # (decision 0149; it is not an independent implementation of the page).
      - run: bash tooling/check-group-wire-vectors.sh
      - run: bash tooling/check-tree-clean.sh
      # The core pin is a commit on tacenta-core main, not a pull request head
      # or a fork commit. It asks GitHub, read-only; if GitHub cannot be
      # reached the step fails rather than passing unchecked.
      - name: The core pin is on tacenta-core main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tooling/check-core-pin.sh
      - name: The core pin check refuses what it should
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tooling/tests/run-check-core-pin-cases.sh
      # The conformance vector files are not empty and not smaller than their
      # floors.
      - run: python3 tooling/check-vectors.py
      - run: bash tooling/tests/run-check-vectors-cases.sh
      # Every gate script in tooling/ is run by a step in this workflow.
      - run: bash tooling/check-gates-wired.sh
      - run: bash tooling/tests/run-check-gates-wired-cases.sh
      - run: bash tooling/tests/run-check-signoff-cases.sh
      - run: bash tooling/tests/run-install-elan-cases.sh
      # A pull request's own commits are checked by the sign-off job. A push
      # to main is checked here, from the commit before the push, because a
      # squash merge's message is written by GitHub after the pull request
      # check ran, and it has to carry the author's sign-off too.
      - name: Commits introduced by a push to main are signed off
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: bash tooling/check-signoff.sh --require-commits "$BASE_SHA"
      # check-advisories skips itself when cargo-audit is absent, and the
      # GitHub-hosted image does not ship it; install so the scan runs. The
      # version is pinned: the tool that decides "no known-vulnerable
      # dependency" should not change between runs unreviewed.
      - run: cargo install cargo-audit --version =0.22.2 --locked
      - run: bash tooling/check-advisories.sh
      # check-licences resolves the compiled graph.
      - run: bash tooling/check-licences.sh

  # Every commit a pull request adds is signed off by its author under the
  # Developer Certificate of Origin (CONTRIBUTING.md). Only pull requests: a
  # push to main is checked in the `checks` job, and the history from before
  # this check has no sign-off on most commits. The full history is fetched so
  # the base branch is there to compare against. The base branch name is passed
  # through the environment, not interpolated into the script.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every added commit is signed off by its author
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tooling/check-signoff.sh --require-commits "origin/${BASE_REF}"

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install elan (Lean toolchain)
        run: bash tooling/install-elan.sh
      # Lean reports every incomplete declaration it elaborates as
      # "declaration uses `sorry`"; the build log is the authoritative list,
      # so the step fails on any such line rather than trusting a grep of the
      # source. `shell: bash` gives `pipefail`, so a failed build fails too.
      - name: The specification builds (no sorry)
        shell: bash
        run: |
          (cd spec && lake build 2>&1) | tee /tmp/spec-build.log
          if grep -q 'declaration uses' /tmp/spec-build.log; then
            echo '::error::the specification contains an incomplete declaration'
            exit 1
          fi
      - name: Committed vectors match the spec
        run: |
          for v in envelope session user stream group; do
            (cd spec && lake exe vectors "$v") > "/tmp/$v-v1.json"
            diff -u "contracts/vectors/$v-v1.json" "/tmp/$v-v1.json"
          done
