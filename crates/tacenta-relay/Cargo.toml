[package]
name = "tacenta-relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Deliberately depends only on the wire format and the delivery machine —
# never on tacenta-core or any cryptographic crate. The relay routes opaque encrypted
# envelopes and cannot read them; that server-blindness is enforced here,
# by the dependency graph (decision record 0012).
[dependencies]
tacenta-wire = { workspace = true }
tacenta-state = { workspace = true }
